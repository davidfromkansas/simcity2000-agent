# DOSBox-X config for SimCity 2000 (DOS) driven by an agent.
# Paths are inside the container; start-game.sh overrides `captures` per run.

[sdl]
fullscreen        = false
fullresolution    = desktop
windowresolution  = original
windowposition    = 0,0
output            = surface
showmenu          = false
autolock          = false
mouse_emulation   = never
usesystemcursor   = false
sensitivity       = 100
waitonerror       = false
priority          = higher,normal

[dosbox]
title             = SimCity 2000
machine           = svga_s3
memsize           = 16
startbanner       = false
fastbioslogo      = true
captures          = /runs/capture
capture format    = avi-zmbv
show recorded filename = false
skip encoding unchanged frames = true

[render]
frameskip         = 0
aspect            = false
doublescan        = false
scaler            = none

[cpu]
core              = auto
cputype           = auto
cycles            = max 90%

[mixer]
nosound           = false
rate              = 22050

[sblaster]
sbtype            = sbpro2
sbbase            = 220
irq               = 5
dma               = 1

[dos]
xms               = true
ems               = true
umb               = true

[autoexec]
@echo off
mount c "/games/sc2000"
c:
SC2000.EXE
