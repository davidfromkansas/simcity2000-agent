# DOSBox-X config for the SimCity 2000 agent.
# The Xvfb screen is 640x480 and DOSBox-X runs fullscreen with no scaling, so a
# game pixel at (x, y) is exactly screen pixel (x, y). agent/toolmap.py relies on this.

[sdl]
fullscreen        = false
fullresolution    = desktop
windowresolution  = 640x480
windowposition    = 0,0
output            = surface
showmenu          = false
autolock          = false
mouse_emulation   = never
usescancodes      = false
waitonerror       = false
priority          = higher,normal

[dosbox]
machine           = svga_s3
memsize           = 16
startbanner       = false
fastbioslogo      = true
quit warning      = false

[render]
aspect            = false
scaler            = none
frameskip         = 0

[cpu]
core              = dynamic
cputype           = pentium
cycles            = max

[mixer]
nosound           = true

[sblaster]
sbtype            = none

[speaker]
pcspeaker         = false

[dos]
xms               = true
ems               = true
umb               = true

[autoexec]
@echo off
mount c /app/games/simcity2000
c:
SC2000.EXE NOSOUND
exit
